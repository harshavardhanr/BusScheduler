<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Higham Hill Bus Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: #8888aa;
      margin-top: 4px;
    }

    #last-updated {
      font-size: 0.75rem;
      color: #6666aa;
      margin-top: 8px;
    }

    .bus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .bus-card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #0f3460;
    }

    .bus-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .bus-badge {
      font-size: 1.1rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 8px;
      min-width: 64px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .badge-W15  { background: #e1251b; color: #fff; }
    .badge-158  { background: #e1251b; color: #fff; }
    .badge-W11  { background: #e1251b; color: #fff; }

    .bus-destination {
      font-size: 0.8rem;
      color: #8888aa;
      line-height: 1.3;
    }

    .bus-destination strong {
      display: block;
      color: #ccccee;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .arrivals-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .arrival-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f3460;
      border-radius: 10px;
      padding: 12px 16px;
    }

    .arrival-item:first-child {
      background: #1a5276;
      border: 1px solid #2980b9;
    }

    .arrival-mins {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      min-width: 60px;
    }

    .arrival-item:first-child .arrival-mins {
      color: #5dade2;
    }

    .arrival-mins span {
      font-size: 0.75rem;
      font-weight: 400;
      color: #8888aa;
      margin-left: 3px;
    }

    .arrival-due {
      font-size: 0.85rem;
      font-weight: 600;
      color: #2ecc71;
    }

    .arrival-time {
      font-size: 0.8rem;
      color: #8888aa;
      text-align: right;
    }

    .arrival-towards {
      font-size: 0.78rem;
      color: #aaaacc;
      max-width: 120px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading {
      color: #6666aa;
      font-size: 0.9rem;
      padding: 20px 0;
      text-align: center;
    }

    .error {
      color: #e74c3c;
      font-size: 0.85rem;
      padding: 12px;
      background: #2c1010;
      border-radius: 8px;
      text-align: center;
    }

    .no-service {
      color: #6666aa;
      font-size: 0.85rem;
      text-align: center;
      padding: 16px 0;
    }

    .refresh-btn {
      margin-bottom: 28px;
      background: #0f3460;
      color: #aaaacc;
      border: 1px solid #1a5276;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:hover { background: #1a5276; color: #fff; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #8888aa;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>
  <header>
    <h1>Higham Hill Bus Tracker</h1>
    <p>Live departures from Higham Hill, Walthamstow</p>
    <div id="last-updated"></div>
  </header>

  <button class="refresh-btn" id="refresh-btn" onclick="fetchAll()">Refresh</button>

  <div class="bus-grid" id="bus-grid">
    <!-- Cards injected by JS -->
  </div>

  <script>
    const BUSES = [
      {
        line: 'W15',
        stopId: '490014624S',
        stopName: 'Whittingham Primary Academy',
        towards: 'Hackney Town Hall',
      },
      {
        line: '158',
        stopId: '490008134E',
        stopName: 'Higham Hill Road',
        towards: 'Stratford',
      },
      {
        line: 'W11',
        stopId: '490008132S',
        stopName: 'Higham Station Avenue',
        towards: 'Walthamstow',
      },
    ];

    const TFL_BASE = 'https://api.tfl.gov.uk';

    function formatMins(seconds) {
      const m = Math.round(seconds / 60);
      if (m <= 0) return { text: 'Due', isDue: true };
      return { text: m.toString(), isDue: false };
    }

    function formatClock(isoString) {
      const d = new Date(isoString);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function buildCard(bus) {
      const card = document.createElement('div');
      card.className = 'bus-card';
      card.id = `card-${bus.line}`;
      card.innerHTML = `
        <div class="bus-card-header">
          <div class="bus-badge badge-${bus.line}">${bus.line}</div>
          <div class="bus-destination">
            <strong>${bus.stopName}</strong>
            towards ${bus.towards}
          </div>
        </div>
        <ul class="arrivals-list" id="arrivals-${bus.line}">
          <li class="loading"><span class="spinner"></span>Loading...</li>
        </ul>
      `;
      return card;
    }

    async function fetchArrivals(bus) {
      const url = `${TFL_BASE}/StopPoint/${bus.stopId}/Arrivals`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data
        .filter(a => a.lineName.toUpperCase() === bus.line.toUpperCase())
        .sort((a, b) => a.timeToStation - b.timeToStation)
        .slice(0, 3);
    }
    function renderArrivals(bus, arrivals) {
      const list = document.getElementById(`arrivals-${bus.line}`);
      if (!list) return;

      if (arrivals.length === 0) {
        list.innerHTML = '<li class="no-service">No buses in the next hour</li>';
        return;
      }

      list.innerHTML = arrivals.map((a, i) => {
        const { text, isDue } = formatMins(a.timeToStation);
        const clock = formatClock(a.expectedArrival);
        const towards = a.towards || a.destinationName || '';
        return `
          <li class="arrival-item">
            <div>
              ${isDue
                ? `<div class="arrival-due">Due now</div>`
                : `<div class="arrival-mins">${text}<span>min</span></div>`
              }
            </div>
            <div>
              <div class="arrival-time">${clock}</div>
              <div class="arrival-towards">${towards}</div>
            </div>
          </li>`;
      }).join('');
    }

    function renderError(bus, msg) {
      const list = document.getElementById(`arrivals-${bus.line}`);
      if (list) list.innerHTML = `<li class="error">${msg}</li>`;
    }

    function renderLoading(bus) {
      const list = document.getElementById(`arrivals-${bus.line}`);
      if (list) list.innerHTML = '<li class="loading"><span class="spinner"></span>Loading...</li>';
    }

    async function fetchAll() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Refreshing…';

      BUSES.forEach(renderLoading);

      await Promise.allSettled(
        BUSES.map(async bus => {
          try {
            const arrivals = await fetchArrivals(bus);
            renderArrivals(bus, arrivals);
          } catch (e) {
            renderError(bus, 'Could not load data. Check your connection.');
          }
        })
      );

      const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('last-updated').textContent = `Last updated: ${now}`;
      btn.disabled = false;
      btn.textContent = 'Refresh';
    }

    // Build cards and fetch
    const grid = document.getElementById('bus-grid');
    BUSES.forEach(bus => grid.appendChild(buildCard(bus)));
    fetchAll();
    setInterval(fetchAll, 60000);
  </script>
</body>
</html>
